<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECE7DD">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅遊">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>冬雪北海道</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
:root{
  --bg:#ECE7DD; --paper:#F7F3EC; --ink:#393833; --muted:#7A766C; --line:#CDC4B4; --dot:#D6CEC0;
  --blue:#6E8FA6; --sage:#87A07F; --rose:#C48A80; --mustard:#C39B4F; --plum:#9B8AA6;
  --sea:#DCE3E2; --land:#E6DFD0;
  --text:'LXGW WenKai TC','PingFang TC','Microsoft JhengHei',serif;
  --type:'Courier Prime','Courier New',monospace;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px)}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.2px);background-size:18px 18px;color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit} button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px}
.wrap{max-width:560px;margin:0 auto}
.ico{width:20px;height:20px;flex:none}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-top{display:flex;align-items:center;gap:8px;padding:10px 16px 10px 18px}
.bar-top .nav{margin-left:auto;padding:0;overflow:visible;gap:4px}
.bar-top .nav a{min-width:0;padding:2px 10px}
.brand{white-space:nowrap}
@media (max-width:430px){ .brand small{display:none} }
.brand{text-decoration:none;font-size:18px;letter-spacing:.12em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--type);font-size:11px;letter-spacing:.08em;color:var(--muted)}
.today{border:1px solid var(--ink);background:transparent;border-radius:3px;padding:2px 12px;font-family:var(--type);font-size:13px;letter-spacing:.06em;cursor:pointer}
.nav{display:flex;gap:2px;overflow-x:auto;padding:6px 12px 8px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;display:flex;flex-direction:column;align-items:center;min-width:42px;padding:3px 7px;border-radius:4px;color:var(--muted)}
.nav a b{font-family:var(--type);font-size:17px;line-height:1.2;font-weight:700}
.nav a small{font-size:10.5px;line-height:1.3;font-family:var(--type)}
.nav a.word b{font-family:var(--text);font-size:15px;font-weight:400;line-height:1.35}
.nav a[aria-current="page"]{color:var(--ink);background:var(--paper);box-shadow:inset 0 -2px 0 var(--c,var(--ink))}

/* overview */
.intro{padding:22px 20px 4px}
.kicker{font-family:var(--type);font-size:12px;letter-spacing:.18em;color:var(--muted)}
.intro h1{margin:4px 0 0;font-size:34px;letter-spacing:.1em;font-weight:700;line-height:1.3}
.intro p{margin:6px 0 0;color:var(--muted);font-size:15px}
.count{margin-top:14px;display:inline-flex;align-items:baseline;gap:8px;border:1px dashed var(--ink);border-radius:4px;padding:4px 14px;font-size:15px}
.count b{font-family:var(--type);font-size:26px;color:var(--rose)}
.world{margin:12px 8px 0;position:relative}
.world svg{width:100%;height:auto;display:block;overflow:visible}
.world a{cursor:pointer}
.world .lbl{font-family:var(--text);font-size:15px;fill:var(--ink)}
.world .sm{font-family:var(--type);font-size:11px;fill:var(--muted);letter-spacing:.06em}
.world .region{font-family:var(--text);font-size:13px;fill:var(--muted);letter-spacing:.3em}
.world .num{font-family:var(--type);font-weight:700;font-size:18px}
@media (prefers-reduced-motion:no-preference){ .pulse{animation:pulse 1.8s ease-out infinite;transform-origin:center;transform-box:fill-box} @keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.9);opacity:0}} }
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:4px 20px 0;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .crew{gap:4px;color:var(--ink)}
.playbtn{margin-left:auto;border:1px solid var(--ink);background:var(--paper);border-radius:999px;padding:3px 12px;font:inherit;font-size:13px;cursor:pointer;min-height:32px}
.playbtn:disabled{opacity:.5}
.legend i{width:14px;height:14px;border-radius:50%;display:inline-block;border:1.5px solid var(--ink)}
h2{font-size:18px;font-weight:400;letter-spacing:.12em;margin:30px 20px 10px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;border-top:1px dashed var(--line)}
.hl{margin:0 18px;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hl li{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.hl strong{display:block;font-size:15.5px;font-weight:400}
.hl strong::before{content:"◆ ";font-size:10px;vertical-align:2px;color:var(--c)}
.hl span{font-size:13.5px;color:var(--muted);line-height:1.6}

/* stage */
.stagehead{padding:20px 20px 6px}
.stagehead .kicker b{color:var(--c);font-weight:700}
.stagehead h1{margin:4px 0 0;font-size:24px;line-height:1.45;font-weight:700;letter-spacing:.04em}
.stagehead .route{margin-top:6px;font-size:14.5px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pips{display:flex;gap:5px;margin-top:12px}
.pips a{width:22px;height:6px;border-radius:3px;background:var(--line)}
.pips a.past{background:var(--muted)}
.pips a.cur{background:var(--c)}
.trail{list-style:none;margin:14px 0 0;padding:0 18px 0 18px;position:relative}
.trail::before{content:"";position:absolute;left:37px;top:6px;bottom:14px;border-left:2px dashed var(--line)}
.cp{position:relative;padding-left:52px;margin:0 0 14px}
.cp .pin{position:absolute;left:4px;top:8px;width:32px;height:32px;border-radius:50%;background:var(--paper);border:2px solid var(--c);display:grid;place-items:center;color:var(--c)}
.cp .card{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:12px 14px 12px}
.tag{display:inline-block;font-family:var(--type);font-size:11px;letter-spacing:.14em;color:var(--c);border-bottom:1px solid var(--c);line-height:1.5}
.cp h3{margin:4px 0 0;font-size:17px;line-height:1.5;font-weight:700}
.hours{display:inline-block;margin-top:6px;font-size:12.5px;color:var(--ink);background:color-mix(in srgb,var(--mustard) 22%,transparent);border-radius:2px;padding:0 8px;line-height:1.8}
.cp p{margin:6px 0 0;font-size:15px}
.cp b{font-weight:700}
.steps{margin:8px 0 0;padding:8px 10px 8px 26px;border-left:2px solid var(--line);font-size:14px}
/* transport segment */
.cp.move .pin{width:26px;height:26px;left:7px;top:10px;border-radius:4px;transform:rotate(45deg);border:1.5px solid var(--muted);color:var(--muted)}
.cp.move .pin svg{transform:rotate(-45deg);width:16px;height:16px}
.cp.move .card{background:transparent;border:1px dashed var(--muted)}
.cp.move .tag{color:var(--muted);border-color:transparent;font-size:13px;letter-spacing:.04em;font-weight:700}
.cp.move h3{font-size:16px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.map{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-size:13.5px;padding:3px 11px;border:1px solid var(--ink);border-radius:999px;min-height:32px}
.map svg{width:14px;height:14px}
.save,.hint{margin:4px 18px 0 18px;padding:14px 16px;border-radius:4px;display:flex;gap:12px;align-items:flex-start}
.save{background:var(--paper);border:2px solid var(--ink)}
.save .badge,.hint .badge{font-family:var(--type);font-size:11px;letter-spacing:.14em;font-weight:700;padding:2px 6px;border-radius:2px;flex:none;margin-top:3px}
.save .badge{background:var(--ink);color:var(--paper)}
.save .v{flex:1}
.save .v small{display:block;font-size:12.5px;color:var(--muted)}
.hint{background:transparent;border:1px dashed var(--rose);margin-bottom:12px}
.hint .badge{border:1px solid var(--rose);color:var(--rose)}
.pager{display:flex;justify-content:space-between;gap:12px;padding:20px 18px 8px}
.pager a{text-decoration:none;font-family:var(--type);font-size:14px;letter-spacing:.06em;border:1px solid var(--ink);border-radius:3px;padding:6px 14px;background:var(--paper)}
.goal{font-family:var(--type)}

/* cost */
.sheet{margin:0 18px;padding:4px 16px;background:var(--paper);border:1px solid var(--line);border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:8px 0;border-top:1px dashed var(--line);vertical-align:top}
tr:first-child td{border-top:0}
td:last-child{text-align:right;white-space:nowrap;padding-left:12px;font-family:var(--type)}
tr.sum td{border-top:1px solid var(--ink);font-weight:700}
.cap{margin:18px 20px 8px;font-size:15px;color:var(--muted)}
.total{margin:16px 18px 0;display:flex;gap:10px;flex-wrap:wrap}
.total div{flex:1 1 140px;padding:12px 14px;border:2px solid var(--ink);border-radius:4px;background:var(--paper)}
.total small{display:block;color:var(--muted);font-size:13px}
.total strong{font-family:var(--type);font-size:21px}
.foot{font-size:12.5px;color:var(--muted);margin:10px 20px 0}
.pack{list-style:none;margin:0 18px;padding:0;display:flex;flex-direction:column;gap:8px}
.pack button{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:12px 14px;cursor:pointer}
.box{width:20px;height:20px;border:1.5px solid var(--ink);border-radius:3px;display:grid;place-items:center;margin-top:3px}
.box svg{width:13px;height:13px;opacity:0}
.pack li.done .box{background:var(--ink);color:var(--paper)}
.pack li.done .box svg{opacity:1}
.pack strong{display:block;font-size:16px;font-weight:400}
.pack span{font-size:14px;color:var(--muted)}
.pack li.done strong{text-decoration:line-through;color:var(--muted)}

/* ledger */
.sync{margin:6px 20px 0;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.sync.live i{background:var(--sage)}
.spent{margin:12px 18px 0;padding:14px 16px;background:var(--paper);border:2px solid var(--ink);border-radius:4px}
.spent .k{font-family:var(--type);font-size:11px;letter-spacing:.16em;color:var(--muted)}
.spent .big{font-family:var(--type);font-size:30px;font-weight:700;line-height:1.25}
.spent .row{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13.5px;color:var(--muted);margin-top:4px}
.spent .row b{font-family:var(--type);color:var(--ink);font-weight:700}
.addform{margin:12px 18px 0;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:4px;display:grid;gap:10px}
.addform label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:3px}
.f-amt{display:flex;gap:8px}
.addform input,.addform select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;min-width:0}
.addform input:focus,.addform select:focus{outline:2px solid var(--blue);outline-offset:0;border-color:transparent}
.f-amt input{font-family:var(--type);font-size:20px}
.seg{display:flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:0 12px;font-family:var(--type);font-size:14px;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;min-height:34px}
.chips button[aria-pressed="true"]{border-color:var(--c);background:var(--c);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addbtn{border:0;background:var(--ink);color:var(--paper);border-radius:4px;padding:10px;font-size:16px;letter-spacing:.2em;cursor:pointer;min-height:46px}
.addbtn:disabled{opacity:.45;cursor:default}
.msg{font-size:13px;color:var(--rose);min-height:1em}
.bars{margin:0 18px;padding:10px 16px;background:var(--paper);border:1px solid var(--line);border-radius:4px}
.bars .r{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.bars .t{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bars .t i{display:block;height:100%;border-radius:4px}
.bars .r b{font-family:var(--type);font-weight:700;font-size:13.5px}
.empty{margin:0 18px;padding:18px;border:1px dashed var(--line);border-radius:4px;text-align:center;color:var(--muted);font-size:14.5px}
.ledger{margin:0 18px;padding:0;list-style:none}
.ledger .dh{font-family:var(--type);font-size:12px;letter-spacing:.14em;color:var(--muted);margin:14px 0 6px;display:flex;justify-content:space-between}
.ledger .e{display:grid;grid-template-columns:10px minmax(0,1fr) auto 32px;gap:10px;align-items:center;padding:9px 12px;background:var(--paper);border:1px solid var(--line);border-radius:4px;margin-bottom:6px}
.ledger .dot{width:10px;height:10px;border-radius:50%}
.ledger .nm{font-size:15px;line-height:1.4}
.ledger .nm small{display:block;font-size:12px;color:var(--muted)}
.ledger .am{font-family:var(--type);font-weight:700;text-align:right;white-space:nowrap;font-size:15px}
.ledger .am small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.del{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;width:32px;height:32px;border-radius:4px}
.del:hover{background:var(--bg);color:var(--rose)}
.ledger .e{grid-template-columns:10px minmax(0,1fr) auto auto}
.del.armed{width:auto;padding:0 10px;font-size:13px;background:var(--rose);color:#fff}
.who-tbl{margin:0 18px;padding:4px 16px;background:var(--paper);border:1px solid var(--line);border-radius:4px}
.who-tbl .r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 14px;align-items:baseline;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.who-tbl .r:first-child{border-top:0;color:var(--muted);font-size:12px}
.who-tbl .r b{font-family:var(--type);font-weight:700;text-align:right;white-space:nowrap}
.who-tbl .r span:not(:first-child){font-family:var(--type);text-align:right;white-space:nowrap}
.who-tbl .p{display:inline-flex;align-items:center;gap:6px}
.who-tbl .p i{width:10px;height:10px;border-radius:50%;display:inline-block}
.pos{color:var(--sage)} .neg{color:var(--rose)}
.xfer{margin:10px 18px 0;display:flex;flex-direction:column;gap:8px}
.xfer div{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--paper);border:2px solid var(--ink);border-radius:4px;font-size:16px}
.xfer .arrow{font-family:var(--type);color:var(--muted)}
.xfer .amt{margin-left:auto;text-align:right;font-family:var(--type);font-weight:700}
.xfer .amt small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.even{margin:10px 18px 0;padding:12px 14px;border:1px dashed var(--sage);border-radius:4px;color:var(--sage);font-size:15px}
.skip{margin:8px 20px 0;font-size:12.5px;color:var(--muted)}
.rate{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 20px 0;font-size:13.5px;color:var(--muted)}
.rate input{width:84px;font-family:var(--type);font-size:15px;border:1px solid var(--line);border-radius:4px;padding:4px 8px;background:var(--paper);color:var(--ink)}
/* menu */
.burger{width:40px;height:40px;margin-left:-8px;border:0;background:transparent;border-radius:4px;display:grid;place-content:center;gap:4px;cursor:pointer;flex:none}
.burger span{display:block;width:20px;height:2px;border-radius:1px;background:var(--ink)}
.burger:hover{background:var(--paper)}
.bar-top .today{margin-left:auto}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(57,56,51,.32);opacity:0;transition:opacity .2s}
.scrim.open{opacity:1}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:21;width:min(86vw,330px);overflow-y:auto;background:var(--bg);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.2px);background-size:18px 18px;border-right:1px solid var(--line);box-shadow:6px 0 24px rgba(57,56,51,.18);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-102%);transition:transform .22s ease-out}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){ .drawer,.scrim{transition:none} }
.dr-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dr-close{width:40px;height:40px;border:0;background:transparent;font-size:26px;line-height:1;color:var(--muted);cursor:pointer;border-radius:4px}
.dr-trip{background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:12px 14px}
.dr-trip strong{display:block;font-size:20px;letter-spacing:.08em;margin-top:2px}
.dr-trip small{font-size:12.5px;color:var(--muted)}
.dr-sec{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.dr-sec a{display:flex;align-items:baseline;justify-content:space-between;text-decoration:none;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px 14px;font-size:16px}
.dr-sec a small{font-family:var(--type);font-size:11px;letter-spacing:.14em;color:var(--muted)}
.dr-sec a[aria-current="page"]{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.dr-label{font-size:13px;letter-spacing:.2em;color:var(--muted);margin:20px 2px 8px}
.dr-days{display:flex;flex-direction:column}
.dr-days a{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:center;text-decoration:none;padding:7px 6px;border-radius:4px;border-top:1px dashed var(--line)}
.dr-days a:first-child{border-top:0}
.dr-days a b{font-family:var(--type);font-size:15px;font-weight:700;color:var(--c)}
.dr-days a span{font-size:14.5px;line-height:1.4}
.dr-days a small{display:block;font-family:var(--type);font-size:11px;color:var(--muted)}
.dr-days a[aria-current="page"]{background:var(--paper)}
.dr-days a.now b::after{content:" ●";font-size:9px;vertical-align:2px}
.dr-trips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.dr-trips li{padding:10px 14px;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
.dr-trips li.on{border-color:var(--ink)}
.dr-trips li.soon{background:transparent;border-style:dashed;color:var(--muted)}
.dr-trips strong{display:block;font-size:15px;font-weight:400}
.dr-trips small{font-size:12px;color:var(--muted)}
.dr-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.dr-list a{display:block;text-decoration:none;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:14px 16px;font-size:18px;letter-spacing:.1em}
.dr-list a[aria-current="page"]{border:2px solid var(--ink);padding:13px 15px}
.bar-top .nav{margin-left:auto}
.bar-top .nav + .today{margin-left:0}
.bar-top [hidden]{display:none}
.isle{margin:6px 18px 0;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.isle svg{display:block;width:100%;height:auto}
.soon-card{margin:12px 18px 0;padding:14px 16px;border:1px dashed var(--ink);border-radius:4px}
.soon-card strong{font-size:16px}
.soon-card p{margin:4px 0 0;font-size:14.5px;color:var(--muted)}
.who-tbl .r{grid-template-columns:minmax(0,1fr) auto auto auto}

function dayDate(d){ const [y,m,dd] = d.date.split('-').map(Number); return new Date(y, m-1, dd); }
function md(d){ const t = dayDate(d); return (t.getMonth()+1) + '/' + t.getDate(); }
function today0(){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function todayIndex(){ const t = today0().getTime(); for (const d of DAYS) if (dayDate(d).getTime() === t) return d.n; return 0; }
function state(d){ const t = today0().getTime(), x = dayDate(d).getTime(); return x < t ? 'past' : x === t ? 'cur' : 'next'; }
function daysUntil(){ return Math.round((dayDate(DAYS[0]) - today0()) / 86400000); }

let ANIM = 0;
const RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const PLANE_START = [284, 38], PLANE_GOAL = () => [86, WM.H - 50];
function sleep(ms, tok){ return new Promise(r => setTimeout(() => r(tok === ANIM), ms)); }
function tween(ms, fn, tok){ return new Promise(res => { const t0 = performance.now(); (function step(t){ if (tok !== ANIM) return res(false); const k = Math.min(1, (t - t0) / ms); fn(k); if (k < 1) requestAnimationFrame(step); else res(true); })(t0); }); }
const ease = k => k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;

function placeFeet(x, fy){ const t = el('team'); if (!t) return; t.style.display = ''; t.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + fy.toFixed(1) + ') scale(1.35)'); }

function nodeXY(n){ return n === 0 ? WM.start : n === 11 ? WM.goal : WM.pts[n-1]; }
async function walkSeg(i, tok){
  const p = el('seg' + i); if (!p) return false;
  const L = p.getTotalLength(), ms = Math.max(900, L * 7);
  const off0 = i === 0 ? 2 : 25, off1 = i === WM.pts.length ? 18 : 25;
  return tween(ms, k => { const e = ease(k), q = p.getPointAtLength(e * L); const off = off0 + (off1 - off0) * e - 14 * Math.sin(Math.PI * e); placeFeet(q.x, q.y - off - Math.abs(Math.sin(k * L / 9)) * 3); }, tok);

async function landing(tok){
  hideTeam();

  if (!await tween(1500, k => { const e = ease(k); placePlane(-60 + (px + 60) * e, -70 + (py + 70) * e - Math.sin(e * Math.PI) * 6, 14 * (1 - e)); }, tok)) return false;

  const [gx, gy] = PLANE_GOAL();
  placePlane(gx, gy, 0);
  if (!await sleep(250, tok)) return false;
  hideTeam();
  if (!await sleep(300, tok)) return false;
  return tween(1600, k => { const e = k * k; placePlane(gx + 360 * e, gy - 180 * e, -16 * Math.min(1, k * 3), 1 - Math.max(0, k - .7) / .3); }, tok);

function settle(){
  const ti = todayIndex(), du = daysUntil();

  if (!ti && du > 0) { placePlane(PLANE_START[0], PLANE_START[1], 0); return; }
  if (!ti) return;
  if (ti === 10) { const [gx, gy] = PLANE_GOAL(); placePlane(gx, gy, 0); return; }
  const [x, y] = nodeXY(ti); placeTeam(x, y);
  if (ti === 1) placePlane(PLANE_START[0], PLANE_START[1], 0);

async function playToday(){
  const tok = ++ANIM; settle();
  if (RM) return;
  const ti = todayIndex(); if (!ti) return;
  if (ti === 1) { if (!await landing(tok)) return; await walkSeg(0, tok); return; }
  hidePlane();
  if (ti === 10) { if (!await walkSeg(9, tok)) return; if (!await walkSeg(10, tok)) return; await takeoff(tok); return; }
  await walkSeg(ti - 1, tok);
}
async function playAll(){
  const tok = ++ANIM; const btn = el('playbtn'); if (btn) btn.disabled = true;
  try {
    if (!await landing(tok)) return;
    for (let i = 0; i <= 10; i++) {
      const tgt = el('seg' + i); if (tgt && i > 0) { const [x,y] = nodeXY(i); }

      if (i < 10) { if (!await sleep(220, tok)) return; }

      h += '<span class="am">' + (e.cur === 'TWD' ? 'NT$ ' + fmt(e.amount) : fmt(e.amount) + ' 円') + (e.cur === 'JPY' ? '<small>≈ NT$ ' + fmt(toTWD(e)) + '</small>' : '') + '</span>';
      h += L.canWrite ? '<button class="del" type="button" data-id="' + esc(e.id) + '" aria-label="刪除 ' + esc(e.item || e.cat) + '">×</button>' : '<span></span>';

  }

function renderSettle(list){
  const box = document.getElementById('settle'); if (!box) return;
  const col = Object.fromEntries(WHO);
  const paid = Object.fromEntries(PEOPLE.map(p => [p, 0])), owe = Object.fromEntries(PEOPLE.map(p => [p, 0]));
  let shared = 0, skipped = 0;
  for (const e of list) {
    if (!(e.who in paid)) { skipped++; continue; }
    const v = toTWD(e), m = splitOf(e);
    paid[e.who] += v; shared += v;
    for (const p of m) owe[p] += v / m.length;
  }
  let h = '<div class="who-tbl"><div class="r"><span>成員</span><span>先付</span><span>應分擔</span><span>差額</span></div>';
  for (const p of PEOPLE) {
    const d = paid[p] - owe[p];
    h += '<div class="r"><span class="p"><i style="background:' + col[p] + '"></i>' + p + '</span><span>' + fmt(paid[p]) + '</span><span>' + fmt(owe[p]) + '</span><b class="' + (d > 0.5 ? 'pos' : d < -0.5 ? 'neg' : '') + '">' + (d > 0.5 ? '+' : d < -0.5 ? '−' : '') + fmt(Math.abs(d)) + '</b></div>';
  }
  h += '<div class="r"><span>合計（NT$）</span><span>' + fmt(shared) + '</span><span>' + fmt(shared) + '</span><span></span></div></div>';
  const cred = [], debt = [];
  for (const p of PEOPLE) { const d = paid[p] - owe[p]; if (d > 0.5) cred.push([p, d]); else if (d < -0.5) debt.push([p, -d]); }
  cred.sort((a,b) => b[1]-a[1]); debt.sort((a,b) => b[1]-a[1]);
  const tr = []; let i = 0, j = 0;
  while (i < debt.length && j < cred.length) {
    const x = Math.min(debt[i][1], cred[j][1]); tr.push([debt[i][0], cred[j][0], x]);
    debt[i][1] -= x; cred[j][1] -= x; if (debt[i][1] < 0.5) i++; if (cred[j][1] < 0.5) j++;
  }
  if (!shared) h += '<div class="even">還沒有分帳資料，記帳時選「誰先付的」就會自動算</div>';
  else if (!tr.length) h += '<div class="even">目前大家打平，不用轉帳</div>';
  else h += '<div class="xfer">' + tr.map(([a,b,x]) => '<div><span class="p">' + a + '</span><span class="arrow">付給 →</span><span class="p">' + b + '</span><span class="amt">NT$ ' + fmt(x) + '<small>≈ ' + fmt(x / L.rate) + ' 円</small></span></div>').join('') + '</div>';
  if (skipped) h += '<p class="skip">有 ' + skipped + ' 筆沒有選付款人，未列入分帳。</p>';
  box.innerHTML = h;
}

  const msg = document.getElementById('msg'), btn = document.getElementById('addbtn');
  msg.style.color = '';
  const amt = Number(String(document.getElementById('f-amt').value).replace(/[,，\s]/g, ''));
  if (!(amt > 0 && amt < 10000000)) { msg.textContent = '請輸入金額'; document.getElementById('f-amt').focus(); return; }
  if (!L.who) { msg.textContent = '請選誰先付的'; return; }
  if (!L.split.length) { msg.textContent = '請至少選一位分攤的人'; return; }
  const old = L.editing ? L.list.find(x => x.id === L.editing) : null;
  const e = { amount: amt, cur: L.cur, cat: L.cat, item: document.getElementById('f-item').value.trim(), day: Number(document.getElementById('f-day').value), who: L.who, split: L.split.slice(), ts: old ? (old.ts || Date.now()) : Date.now() };
  btn.disabled = true;
  try {
    const editing = L.editing;
    if (editing) { await updateEntry(editing, e); endEdit(); } else { await addEntry(e); document.getElementById('f-amt').value = ''; document.getElementById('f-item').value = ''; }
    msg.style.color = 'var(--sage)'; msg.textContent = editing ? '已修改' : '已記下';
    setTimeout(() => { if (/^已(記下|修改)$/.test(msg.textContent)) { msg.textContent = ''; msg.style.color = ''; } }, 1600);
  } catch (err) { writeFailed(); } finally { btn.disabled = false; }
});
document.getElementById('view').addEventListener('change', ev => {
  if (ev.target.id !== 'f-rate') return;
  const r = Number(ev.target.value); if (!(r > 0 && r < 5)) { ev.target.value = L.rate; return; }
  L.rate = r; try { localStorage.setItem('hk-rate', String(r)); } catch (e) {}
  renderLedger();
});
async function connectFirebase(){
  if (!FIREBASE_CONFIG) return;
  L.mode = 'wait'; renderLedger();
  const timer = setTimeout(() => { if (L.mode === 'wait') { L.mode = 'local'; loadLocal(); renderLedger(); } }, 15000);
  try {
    const app = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const fs = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const fbApp = app.initializeApp(FIREBASE_CONFIG);
    let db;
    try { db = fs.initializeFirestore(fbApp, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
    catch (e) { db = fs.getFirestore(fbApp); }
    const col = fs.collection(db, 'trips', TRIP_ID, 'expenses');
    const clean = e => { const o = Object.assign({}, e); delete o._pending; return o; };
    L.backend = {
      add: e => { const ref = fs.doc(col); e.id = ref.id; fs.setDoc(ref, clean(e)).catch(writeFailed); },
      set: (id, e) => { e.id = id; fs.setDoc(fs.doc(col, id), clean(e)).catch(writeFailed); },
      del: id => { fs.deleteDoc(fs.doc(col, id)).catch(writeFailed); }
    };
    fs.onSnapshot(col, { includeMetadataChanges: true }, snap => {
      clearTimeout(timer); L.mode = 'db';
      L.list = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id, _pending: d.metadata.hasPendingWrites })).filter(e => typeof e.amount === 'number' && e.amount > 0);
      renderLedger();
    }, () => { clearTimeout(timer); L.mode = 'local'; L.backend = null; loadLocal(); renderLedger(); });
  } catch (e) { clearTimeout(timer); L.mode = 'local'; L.backend = null; renderLedger(); }
}

async function connectDb(){
  if (!window.claude || typeof window.claude.use !== 'function') return connectFirebase();
  L.mode = 'wait'; renderLedger();
  const timer = setTimeout(() => { if (L.mode === 'wait') { L.mode = 'local'; loadLocal(); renderLedger(); } }, 10000);
  let db = null;
  try { db = await window.claude.use('db'); } catch (e) { db = null; }
  if (!db) { clearTimeout(timer); L.mode = 'local'; renderLedger(); return connectFirebase(); }
  try { const user = await window.claude.use('user'); const w = user ? await user.can('data.write') : null; if (w === false) L.canWrite = false; } catch (e) {}
  L.db = db;
  L.backend = { add: async e => { const ref = db.collection('expenses').doc(); e.id = ref.id; const o = Object.assign({}, e); delete o._pending; await ref.set(o); }, set: async (id, e) => { e.id = id; const o = Object.assign({}, e); delete o._pending; await db.collection('expenses').doc(id).set(o); }, del: id => db.collection('expenses').doc(id).delete() };
  db.collection('expenses').onSnapshot(snap => {
    clearTimeout(timer);
    L.mode = 'db';
    L.list = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id })).filter(e => typeof e.amount === 'number' && e.amount > 0);
    const wasWrite = !!document.getElementById('addform');
    if (!L.canWrite && wasWrite) { show(); return; }
    renderLedger();
  }, () => { clearTimeout(timer); L.mode = 'local'; L.db = null; L.backend = null; loadLocal(); renderLedger(); });
}

function show(){
  L.editing = null;
  let id = (location.hash || '').slice(1);
  if (!/^(overview|cost|ishigaki|day([1-9]|10))$/.test(id)) id = 'overview';
  const view = document.getElementById('view');
  view.classList.remove('view'); void view.offsetWidth; view.classList.add('view');
  view.innerHTML = id === 'overview' ? renderOverview() : id === 'cost' ? renderCost() : id === 'ishigaki' ? renderIshigaki() : renderDay(DAYS[Number(id.slice(3)) - 1]);
  renderNav(id); window.scrollTo(0, 0);
  ANIM++;
  if (id === 'cost') renderLedger();
  if (id === 'overview') { requestAnimationFrame(() => playToday()); const pb = el('playbtn'); if (pb) pb.addEventListener('click', playAll); }
}
document.getElementById('view').addEventListener('click', e => {
  const b = e.target.closest('.pack button'); if (!b) return;
  const li = b.closest('[data-k]'), k = li.dataset.k;
  if (done[k]) delete done[k]; else done[k] = 1; save();
  li.classList.toggle('done', !!done[k]); b.setAttribute('aria-pressed', done[k] ? 'true' : 'false');
  const pc = document.getElementById('packcount'); if (pc) pc.textContent = '已準備 ' + PACK.filter((_,i) => done['p-'+i]).length + ' / ' + PACK.length;
});
document.getElementById('todayBtn').addEventListener('click', () => {
  const ti = todayIndex(), target = ti ? '#day' + ti : '#overview';
  if (location.hash === target) show(); else location.hash = target;
});
window.addEventListener('hashchange', show);
show();
connectDb();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
